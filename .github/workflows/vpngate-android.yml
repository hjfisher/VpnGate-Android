name: VpnGate-Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    environment: VpnGate-Android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          echo "sdkmanager licenses are pre-accepted on the runner"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > my-key.jks
          echo "Keystore size: $(wc -c < my-key.jks) bytes"
          keytool -list -keystore my-key.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} -v

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Sign and rename APKs
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          SIGNER=$BUILD_TOOLS/apksigner
          TAG="${{ github.ref_name }}"
          ALIAS=$(keytool -list -v -keystore my-key.jks -storepass "$KS_PASS" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)
          echo "Detected keystore alias: $ALIAS"

          mkdir -p final

          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            $SIGNER sign --ks my-key.jks --ks-key-alias "$ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "final/VPNGATE-ANDROID-${TAG}-release.apk" "$apk"
          done

          for apk in app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            $SIGNER sign --ks my-key.jks --ks-key-alias "$ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out "final/VPNGATE-ANDROID-${TAG}-debug.apk" "$apk"
          done

          echo "=== Verifying signatures ==="
          for apk in final/*.apk; do
            echo "--- $apk ---"
            $SIGNER verify --verbose "$apk"
          done

          echo "=== Final APKs ==="
          ls -la final/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: final/VPNGATE-ANDROID-*-release.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: final/VPNGATE-ANDROID-*-debug.apk
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts/release

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: artifacts/debug

      - name: List artifacts
        run: |
          echo "=== Release APK ==="
          ls -la artifacts/release/
          echo "=== Debug APK ==="
          ls -la artifacts/debug/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VpnGate-Android
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/release/*.apk
            artifacts/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}